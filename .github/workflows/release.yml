name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish-tauri:
    # Updater signing secrets live in the "release" environment, restricted to v* tags.
    environment: release
    permissions:
      # create the draft Release and upload the installers
      contents: write
      # sign and store the build provenance attestation
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            installers: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            installers: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-07-08) — bump manually to track new Rust stable releases

      # No Rust cache on purpose: a restored cache would go straight into the signed binary, and with
      # monthly releases it was always evicted (7 days unused) before the next tag anyway.

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # --ignore-scripts: no dependency install script runs in the job that later receives the signing key
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      # Fails if Cargo.toml and Cargo.lock disagree, so cargo never re-resolves crates into the signed binary.
      - name: Check Cargo.lock is up to date
        working-directory: src-tauri
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Billie ${{ github.ref_name }}'
          releaseBody: 'Instaladores gerados automaticamente para esta versão. Baixe o arquivo correspondente ao seu sistema operacional na seção de assets abaixo.'
          releaseDraft: true
          prerelease: false

      # Lets anyone who downloads an installer by hand check it came from this workflow and commit:
      # gh attestation verify <installer> --repo eduardoteranisi/billie-project
      - name: Attest installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.installers }}
